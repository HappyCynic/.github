# Weekly PRs for the actions the agent pipeline pins (by commit SHA).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /actions/agent-sdlc]
    schedule: { interval: weekly }
    # Only propose releases that have been out for two weeks.
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ["*"] }
